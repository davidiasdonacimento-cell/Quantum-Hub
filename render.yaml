services:
  - type: web
    name: quantum-hub
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quantum-hub-db-ohio
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: davidiasdonacimento@gmail.com

databases:
  # Banco original preservado; continuará em Oregon até decidirmos removê-lo.
  - name: quantum-hub-db
    databaseName: quantum_hub
    user: quantum_hub
    plan: free

  # Banco novo na mesma região da aplicação web.
  - name: quantum-hub-db-ohio
    databaseName: quantum_hub
    user: quantum_hub
    plan: free
    region: ohio
