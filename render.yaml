services:
  - type: web
    name: quantum-hub
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quantum-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: davidiasdonacimento@gmail.com

databases:
  - name: quantum-hub-db
    databaseName: quantum_hub
    user: quantum_hub
    plan: free
